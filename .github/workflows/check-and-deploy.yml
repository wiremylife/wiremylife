name: Check connectors, build, deploy

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC), off the top of the hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["data/connectors.json"]

permissions:
  contents: write   # lets the job commit refreshed data/connectors.json

concurrency:
  group: check-and-deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Level 0 probes + repo health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in token, raises the GitHub API rate limit
        run: node scripts/check.mjs

      - name: Commit refreshed statuses (history lives in git)
        run: |
          git config user.name "wiremylife-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/connectors.json
          git diff --cached --quiet || git commit -m "data: status refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Build site
        run: npx @11ty/eleventy

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=wiremylife --branch=main
